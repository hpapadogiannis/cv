<style>
:root{

}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111214; --bg-2:#1b1e21; --panel:#191b1e; --fg:#eceae5; --fg-2:#a9abb1; --fg-3:#787a81;

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scroll-behavior:smooth}
body{

  font-family:var(--sans); font-size:16.5px; line-height:1.66;

}
a{color:inherit}
.wrap{max-width:var(--wrap); margin:0 auto; padding:0 1.8rem}

/* ---------- top bar ---------- */
header.bar{position:sticky; top:0; z-index:30; background:color-mix(in srgb,var(--bg) 88%,transparent);

.bar .wrap{display:flex; align-items:center; gap:1.4rem; height:54px}
.brand{font-family:var(--serif); font-weight:600; font-size:.95rem; letter-spacing:-.01em; white-space:nowrap}
nav.links{display:flex; gap:1.25rem; margin-left:auto; font-size:.83rem; color:var(--fg-2)}
nav.links a{text-decoration:none; padding:.2rem 0; border-bottom:1px solid transparent; transition:.15s}
nav.links a:hover{color:var(--fg); border-bottom-color:var(--accent)}
.langs{display:flex; border:1px solid var(--rule); border-radius:999px; overflow:hidden; margin-left:1rem}
.langs button{font:inherit; font-size:.73rem; letter-spacing:.07em; text-transform:uppercase;
  padding:.3rem .62rem; background:transparent; color:var(--fg-3); border:0; cursor:pointer; transition:.15s}
.langs button[aria-pressed="true"]{background:var(--accent); color:#fff}
@media (prefers-color-scheme:dark){.langs button[aria-pressed="true"]{color:#0f1417}}
@media(max-width:820px){nav.links{display:none}}

/* ---------- name band ---------- */
.band{background:var(--bg-2); border-bottom:1px solid var(--rule)}
.band .wrap{display:flex; align-items:center; gap:2.5rem; padding-top:2.9rem; padding-bottom:2.9rem}
.bandtext{min-width:0; flex:1}
h1{
  font-family:var(--sans); font-weight:600; text-transform:uppercase;
  letter-spacing:.12em; line-height:1.14;
  font-size:clamp(1.55rem,4.1vw,2.7rem); margin:0 0 .6rem;
}
.role{font-size:.97rem; color:var(--fg-2); margin:0 0 .25rem; max-width:40rem}
.affil{font-size:.88rem; color:var(--fg-3); margin:.55rem 0 0}
.affil span{display:block}
.portrait{
  flex:none; width:185px; height:185px; border-radius:24px; overflow:hidden;
  background:var(--accent-soft); display:grid; place-items:center; border:1px solid var(--rule);
}
.portrait img{width:100%; height:100%; object-fit:cover; display:block}
.monogram{font-family:var(--serif); font-size:2.5rem; color:var(--accent); letter-spacing:.02em}
@media(max-width:700px){
  .band .wrap{flex-direction:column-reverse; align-items:flex-start; gap:1.5rem}
  .portrait{width:104px; height:104px}
}

/* ---------- two columns ---------- */
.body{display:grid; grid-template-columns:19.5rem minmax(0,1fr); gap:0; align-items:start}
.side{
  position:sticky; top:54px; padding:2.6rem 2.2rem 3rem 0;
  border-right:1px solid var(--rule); align-self:stretch;
}
.main{padding:2.6rem 0 3rem 2.6rem; min-width:0}
@media(max-width:900px){
  .body{grid-template-columns:1fr}
  .side{position:static; border-right:0; border-bottom:1px solid var(--rule); padding:2.2rem 0}
  .main{padding:2.2rem 0 3rem}
}

/* ---------- blocks ---------- */
.label{font-size:.71rem; letter-spacing:.17em; text-transform:uppercase; color:var(--fg-3); margin:0 0 .5rem}
h2{font-family:var(--serif); font-weight:600; letter-spacing:-.018em;
  font-size:clamp(1.42rem,2.8vw,1.78rem); margin:0 0 1.4rem; line-height:1.18}
section{padding:0 0 2.9rem}
section + section{padding-top:2.4rem; border-top:1px solid var(--rule)}
.prose p{margin:0 0 1.05rem; color:var(--fg-2); max-width:42rem}
.prose p:last-child{margin-bottom:0}

.sideblock{margin:0 0 2rem}
.sideblock:last-child{margin-bottom:0}
.sideblock h3{font-family:var(--sans); font-weight:600; font-size:.78rem; letter-spacing:.14em;

.idlinks{display:flex; flex-direction:column; gap:.45rem}

.idlinks svg{width:15px; height:15px; flex:none; color:var(--fg-3)}

.chip{font-size:.8rem; padding:.22rem .6rem; border:1px solid var(--rule); border-radius:5px; color:var(--fg-2)}

/* ---------- publications ---------- */
.filters{display:flex; flex-wrap:wrap; gap:.4rem; margin:0 0 1.8rem}
.filters button{font:inherit; font-size:.8rem; padding:.3rem .8rem; border-radius:999px; cursor:pointer;

.filters button:hover{color:var(--fg)}
.filters button[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.pubyear{display:grid; grid-template-columns:4.4rem minmax(0,1fr); gap:1.3rem; padding:1.3rem 0; border-top:1px solid var(--rule)}
.pubyear:first-of-type{border-top:0; padding-top:0}
.yr{font-family:var(--serif); font-size:1rem; color:var(--fg-3); padding-top:.1rem}
.pub{margin:0 0 1.45rem}
.pub:last-child{margin-bottom:0}
.pub .t{font-family:var(--serif); font-size:1.02rem; line-height:1.4; margin:0 0 .28rem}
.pub .t a{text-decoration:none; background-image:linear-gradient(var(--accent),var(--accent));

.pub .t a:hover{background-size:100% 1px; color:var(--accent)}

@media(max-width:620px){.pubyear{grid-template-columns:1fr; gap:.45rem} .yr{padding-top:0}}

/* ---------- timeline ---------- */

.item{display:grid; grid-template-columns:6.8rem minmax(0,1fr); gap:1.4rem; padding:1.15rem 0; border-top:1px solid var(--rule)}

::selection{background:var(--accent); color:#fff}

let lang = "en", filter = "all";
try{ const s = localStorage.getItem("lang"); if(s==="el"||s==="en") lang = s; }catch(e){}

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function renderPubs(){
  const t = T[lang];
  const list = PUBS.filter(p => filter === "all" || p.k === filter);
  const years = [...new Set(list.map(p => p.y))].sort((a,b) => b - a);
  document.getElementById("pubs").innerHTML = years.map(y => {
    const items = list.filter(p => p.y === y).map(p => {
      const authors = p.a.map(a => a === "*" ? "<strong>" + (lang === "el" ? ME_EL : ME) + "</strong>" : esc(a)).join(", ");
      const title = p.doi
        ? '<a href="https://doi.org/' + esc(p.doi) + '">' + esc(p.t) + "</a>"
        : esc(p.t);
      const kind = '<span class="tag">' + (p.k === "journal" ? (lang === "el" ? "άρθρο" : "article") : (lang === "el" ? "συνέδριο" : "conference")) + "</span>";
      let venue = "<em>" + esc(p.v) + "</em>";
      if(p.d) venue += ", " + esc(p.d);
      if(p.note) venue += ". " + esc(p.note[lang]);
      return '<div class="pub"><p class="t">' + title + kind + '</p><p class="a">' + authors + '</p><p class="v">' + venue + "</p></div>";
    }).join("");
    return '<div class="pubyear"><div class="yr">' + y + '</div><div>' + items + "</div></div>";
  }).join("");
  document.querySelectorAll(".filters button").forEach(b => {
    b.textContent = t["f_" + b.dataset.f];
    b.setAttribute("aria-pressed", String(b.dataset.f === filter));
  });
}

function renderList(el, rows){
  document.getElementById(el).innerHTML = rows.map(r => {
    const [role, org, desc] = r[lang];
    return '<div class="item"><div class="when">' + esc(r.w) + '</div><div class="what">' +
      "<h3>" + esc(role) + "</h3><p class=\"org\">" + esc(org) + "</p>" +
      (desc ? '<p class="d">' + esc(desc) + "</p>" : "") + "</div></div>";
  }).join("");
}

function render(){
  const t = T[lang];
  document.documentElement.lang = lang;
  document.title = t.brand;
  document.querySelectorAll("[data-t]").forEach(n => { if(t[n.dataset.t] !== undefined) n.textContent = t[n.dataset.t]; });
  document.getElementById("researchProse").innerHTML = t.research.map(p => "<p>" + esc(p) + "</p>").join("");
  document.getElementById("skillChips").innerHTML = SKILLS.map(s => '<span class="chip">' + esc(s) + "</span>").join("");
  renderList("expList", EXP);
  renderList("eduList", EDU);
  renderPubs();
  document.querySelectorAll(".langs button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
}

document.querySelectorAll(".langs button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try{ localStorage.setItem("lang", lang); }catch(e){}
  render();
}));
document.querySelectorAll(".filters button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f; renderPubs();
}));

render();
